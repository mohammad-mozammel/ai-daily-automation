name: Daily AI Git Push

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:


jobs:
  automation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        pip install openai


    - name: Run AI automation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python automation/main.py


    - name: Commit changes
      run: |
        git config user.name "AI Automation Bot"
        git config user.email "bot@github.com"

        git add .

        git commit -m "Daily AI update $(date)" || echo "No changes"


    - name: Push changes
      run: |
        git push
