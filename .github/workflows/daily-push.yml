name: Daily AI Git Push


on:

  schedule:
    # Every day at 8:00 AM Bangladesh time
    # UTC +6 = 02:00 UTC
    - cron: "0 2 * * *"


  workflow_dispatch:



jobs:

  automation:

    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: Install dependencies

        run: |

          pip install google-generativeai



      - name: Run AI automation

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python automation/main.py



      - name: Commit changes

        run: |

          git config user.name "AI Daily Bot"

          git config user.email "ai-bot@github.com"


          git add .


          git commit -m "AI daily update $(date)" || echo "No changes"



      - name: Push changes

        run: |

          git push
